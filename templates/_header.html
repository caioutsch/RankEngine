<header class="top-header">
    <div class="header-container">
        <a href="/" class="brand-logo">
            <span class="brand-rank">Rank</span><span class="brand-engine">Engine</span>
        </a>

        <div class="header-actions">
            {% if usuario %}
                <a href="/perfil" class="btn-login" title="Acessar meu perfil">
                    <div class="avatar-placeholder active-user">
                        <span>{{ usuario.iniciais }}</span>
                    </div>
                    <span>{{ usuario.nome }}</span>
                </a>
            {% else %}
                <a href="/auth" class="btn-login" title="Entrar ou Cadastrar">
                    <div class="avatar-placeholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <span>Entrar</span>
                </a>
            {% endif %}
        </div>
    </div>
</header>
